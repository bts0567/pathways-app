<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reclaim.: legal options and support</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@500;700&display=swap">
<style>
/* ---------- Color theme (light + dark mode use the same names) ---------- */
:root{--bg:#F0F6FB;--card:#fff;--ink:#2E3A4A;--mute:#5F7187;--teal:#2B7A9E;--hero:#BFD9F2;--amber:#FFC97A;--line:#D9E6F2;--tealbg:#E3F0FB;--danger:#C24A3D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B2430;--card:#232E3D;--ink:#EAF1F8;--mute:#9FB0C2;--teal:#6FC3E0;--hero:#3A5068;--amber:#FFD79A;--line:#324256;--tealbg:#1E3344;--danger:#F2A39A}}
:root[data-theme="dark"]{--bg:#1B2430;--card:#232E3D;--ink:#EAF1F8;--mute:#9FB0C2;--teal:#6FC3E0;--hero:#3A5068;--amber:#FFD79A;--line:#324256;--tealbg:#1E3344;--danger:#F2A39A}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:Literata,Georgia,serif;line-height:1.2;margin:0 0 .5rem}
main{max-width:720px;margin:0 auto;padding:1rem}
/* ---------- Header: back button + app name + quick-exit ---------- */
header{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:0 auto;padding:.75rem 1rem}
.brand{font-family:Literata,Georgia,serif;font-weight:700;font-size:1.3rem}
.hleft{display:flex;align-items:center;gap:.5rem}
.backbtn{background:transparent;border:1px solid var(--teal);color:var(--teal);border-radius:8px;padding:.45rem .7rem;font-weight:600;font-size:.85rem;cursor:pointer}
.exit{background:var(--danger);color:#fff;border:0;border-radius:8px;padding:.55rem .9rem;font-weight:700;font-size:.95rem;cursor:pointer}
/* ---------- Reusable building blocks: cards, hero banner, buttons ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin:.75rem 0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hero{background:var(--hero);color:var(--ink);border-radius:16px;padding:1.4rem;margin:.5rem 0}
.hero h1{font-size:1.8rem}.hero p{margin:.4rem 0;color:var(--ink)}
.hero a{color:var(--ink);font-weight:700;text-decoration:underline}
.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:.65rem 1rem;font-size:1rem;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--teal);border:1px solid var(--teal)}
/* ---------- Learn tab: topic-switcher buttons + numbered step list ---------- */
.topicnav{display:flex;flex-wrap:wrap;gap:.5rem;margin:.75rem 0}
.topicnav button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:.6rem .85rem;font-size:.88rem;font-weight:600;cursor:pointer;flex:1 1 150px}
.topicnav button[aria-current="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.stepper{list-style:none;margin:1.1rem 0 0;padding:0;counter-reset:s}
.stepper li{position:relative;padding:.1rem 0 1.25rem 2.1rem;border-left:2px solid var(--line);margin-left:14px}
.stepper li:last-child{border-color:transparent}
.stepper li::before{counter-increment:s;content:counter(s);position:absolute;left:-15px;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center}
@media(prefers-color-scheme:dark){
:root:not([data-theme="light"]) .btn:not(.alt),:root:not([data-theme="light"]) .chip[aria-pressed="true"],:root:not([data-theme="light"]) .topicnav button[aria-current="true"],:root:not([data-theme="light"]) .stepper li::before{color:#10202a}
:root:not([data-theme="light"]) .exit{color:#2a1210}}
li{margin:.35rem 0}.note{background:var(--tealbg);border-radius:8px;padding:.6rem .8rem;font-size:.92rem}
.srcline{font-size:.78rem;color:var(--mute);margin-top:.8rem;padding-top:.6rem;border-top:1px solid var(--line)}
.srcline a{color:var(--mute);text-decoration:underline}
.mute{color:var(--mute);font-size:.92rem}
/* ---------- Bottom tab bar ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:.8rem .2rem;font-size:.85rem;font-weight:600;cursor:pointer;border-top:3px solid transparent}
nav button[aria-selected="true"]{color:var(--teal);border-top-color:var(--teal)}
/* ---------- Find-help tab: search box + filter chips ---------- */
input[type=search]{width:100%;padding:.7rem;border:1px solid var(--line);border-radius:8px;font-size:1rem;background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.35rem .8rem;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
/* ---------- Checklists (roadmap + safety plan) ---------- */
label.row{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem 0;border-bottom:1px solid var(--line)}
label.row input{margin-top:.3rem;width:1.1rem;height:1.1rem}
.tag{font-size:.8rem;color:var(--teal);font-weight:700}
a{color:var(--teal)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.5rem 0}
.typecard{background:var(--tealbg);border-radius:8px;padding:.6rem .7rem}
.typecard b{font-size:.88rem}.typecard p{margin:.25rem 0 0;font-size:.85rem;color:var(--mute)}
@media(max-width:480px){.typegrid{grid-template-columns:1fr}}
@media print{header,nav,.btn,.chip,select,input,.exit{display:none!important}body{padding-bottom:0}}
</style></head><body>

<header>
  <div class="hleft">
    <button id="backBtn" class="backbtn" hidden aria-label="Go back">&larr; Back</button>
    <span class="brand">Reclaim.</span>
  </div>
  <button class="exit" id="exitBtn" aria-label="Quick exit to a weather site">Quick exit</button>
</header>
<main id="appRoot"></main>
<nav role="tablist" id="tabBar"></nav>

<script>
/* =====================================================================
   RECLAIM. — a plain-JavaScript, single-page app.
   No frameworks. The whole app works with one simple idea:

     1. A few variables (below, under "APP STATE") remember what the
        person is currently looking at: which tab, which topic, etc.
     2. renderApp() reads those variables and rebuilds the visible
        HTML to match.
     3. Every button's onclick just changes one of those variables and
        calls renderApp() again.

   That's the entire architecture. Nothing is saved to a server —
   everything lives only in these variables while the page is open.
   ===================================================================== */

/* ---------------------------------------------------------------------
   SECTION 1: CONTENT DATA
   This is the actual information shown in the app: tabs, legal topics,
   the 50 states, shelters/hotlines, and the safety-plan checklist.
   Keeping all the real content up here (separate from the rendering
   logic below) makes it easy to edit the words without touching code.
   --------------------------------------------------------------------- */

const TAB_LIST = [
  ["home", "Home"],
  ["learn", "Learn"],
  ["roadmap", "My roadmap"],
  ["help", "Find help"],
  ["safety", "Safety plan"]
];

// All 50 states + DC, as [abbreviation, full name] pairs.
const STATE_LIST = [["AL","Alabama"],["AK","Alaska"],["AZ","Arizona"],["AR","Arkansas"],["CA","California"],["CO","Colorado"],["CT","Connecticut"],["DE","Delaware"],["DC","District of Columbia"],["FL","Florida"],["GA","Georgia"],["HI","Hawaii"],["ID","Idaho"],["IL","Illinois"],["IN","Indiana"],["IA","Iowa"],["KS","Kansas"],["KY","Kentucky"],["LA","Louisiana"],["ME","Maine"],["MD","Maryland"],["MA","Massachusetts"],["MI","Michigan"],["MN","Minnesota"],["MS","Mississippi"],["MO","Missouri"],["MT","Montana"],["NE","Nebraska"],["NV","Nevada"],["NH","New Hampshire"],["NJ","New Jersey"],["NM","New Mexico"],["NY","New York"],["NC","North Carolina"],["ND","North Dakota"],["OH","Ohio"],["OK","Oklahoma"],["OR","Oregon"],["PA","Pennsylvania"],["RI","Rhode Island"],["SC","South Carolina"],["SD","South Dakota"],["TN","Tennessee"],["TX","Texas"],["UT","Utah"],["VT","Vermont"],["VA","Virginia"],["WA","Washington"],["WV","West Virginia"],["WI","Wisconsin"],["WY","Wyoming"]];

function getStateName(abbr) {
  const match = STATE_LIST.find(s => s[0] === abbr);
  return match ? match[1] : abbr;
}
// WomensLaw.org publishes a page for every state at a predictable
// web address, so we can build the right link just from the state's
// abbreviation instead of hard-coding 50 separate URLs.
function womensLawHubUrl(abbr) { return `https://www.womenslaw.org/laws/${abbr.toLowerCase()}`; }
function womensLawOrdersUrl(abbr) { return `https://www.womenslaw.org/laws/${abbr.toLowerCase()}/restraining-orders`; }

/*
  Each topic below has the SAME shape, which is what makes the Learn
  tab's code simple even though the content is complex:

    id          short identifier used to track which topic is open
    title       shown as the card heading
    getSummary(stateAbbr)  -> returns the intro paragraph (a function,
                 so the text can change depending on which state the
                 person picked -- e.g. Missouri gets Missouri-specific
                 detail, every other state gets an accurate general
                 explanation plus a link to that state's real source)
    getSteps(stateAbbr)    -> returns an array of step strings
    getSources(stateAbbr)  -> returns an array of [label, url] pairs
                 shown as a small citation line at the bottom
    orderTypes  (optional) extra list only the "orders" topic uses,
                 to show the different kinds of protective orders
*/
const LEGAL_TOPICS = [
  {
    id: "orders",
    title: "Protective orders",
    getSummary: (ab) => `A court order that can require someone to stay away, leave a shared home, or stop contacting you (names vary: order of protection, restraining order, injunction). Most states, including ${getStateName(ab)}, use two stages: a temporary order a judge can often grant the same day, and a full order after a hearing where both sides are heard.`,
    getSteps: (ab) => ab === "MO" ? [
        "Figure out which petition fits: an Adult Order of Protection (spouses, family, dating partners, household members) or a Child Order of Protection. <a href='https://www.courts.mo.gov/page.jsp?id=533' target='_blank' rel='noopener'>See courts.mo.gov overview</a>.",
        "Get the petition (form SJRC/AA40) free from your county circuit clerk, or download it. <a href='https://www.courts.mo.gov/page.jsp?id=383' target='_blank' rel='noopener'>Download Missouri court forms</a>.",
        "File at the circuit court in the county where you or the other person lives. Courts can issue an emergency ex parte order the same day, including after hours in urgent cases.",
        "If granted, you'll get a hearing date for a full order, usually within about 15 days. You must attend the hearing to keep protection in place.",
        "Once issued, the order goes into MULES (Missouri's statewide law enforcement system) within 24 hours, so any officer in the state can enforce it.",
        "Find your county courthouse: <a href='https://www.courts.mo.gov' target='_blank' rel='noopener'>courts.mo.gov</a>."
      ] : [
        "Get the petition forms free from your county or district courthouse clerk. Ask specifically about an emergency/temporary order if you're in immediate danger.",
        "File at the court in the county where you or the other person lives. Many courts can issue a same-day emergency order before the other person is even notified.",
        "If a temporary order is granted, you'll get a date for a full hearing. You must attend it to keep protection in place long-term.",
        "The exact forms, deadlines, and what the order can include (custody, pets, firearms, address privacy) differ by state. Don't guess, check your state's page below."
      ],
    getSources: (ab) => [["Exact forms, process, and definitions for " + getStateName(ab), womensLawOrdersUrl(ab)]],
    orderTypes: [
      { title: "Domestic violence / order of protection", desc: "For spouses, former spouses, dating partners, and family or household members." },
      { title: "Child protection order", desc: "Protects a minor; usually filed by a parent or guardian, sometimes against a non-household member." },
      { title: "Civil harassment / stalking order", desc: "For threats, harassment, or stalking from someone you don't have a close relationship with: a neighbor, acquaintance, or stranger." },
      { title: "Elder or dependent adult abuse order", desc: "For abuse of an elderly or dependent adult; sometimes requestable by someone acting on their behalf." },
      { title: "Workplace violence order", desc: "In some states, an employer can request this on behalf of an employee facing threats at work." }
    ]
  },
  {
    id: "housing",
    title: "Housing and leases",
    getSummary: () => "You may be able to leave a lease early or move without losing your housing rights.",
    getSteps: (ab) => [
      ab === "MO"
        ? "Missouri lets survivors end a private lease early with documentation such as a protective order, police report, or advocate letter. Ask a legal aid attorney about current requirements."
        : "Many states let survivors end a private lease early with documentation such as a protective order, police report, or advocate letter. Check your state's exact rule below, since requirements differ.",
      "If you live in public or subsidized housing, federal VAWA protections can prevent eviction because of abuse and allow an emergency transfer nationwide. <a href='https://www.hud.gov/program_offices/public_indian_housing/programs/public/vawa' target='_blank' rel='noopener'>HUD – VAWA housing protections</a>.",
      "Ask your housing authority or landlord in writing for an emergency transfer, and keep a copy of the request.",
      "Call a shelter hotline if you need a safe place tonight. See the Find help tab."
    ],
    getSources: (ab) => [["Housing and other legal topics for " + getStateName(ab), womensLawHubUrl(ab)]]
  },
  {
    id: "kids",
    title: "Children and custody",
    getSummary: () => "Courts look at safety when deciding custody and visits.",
    getSteps: () => [
      "A protective order can often ask for temporary custody and supervised or no visitation.",
      "Keep a record of incidents involving your children, plus school or doctor notes.",
      "Talk to legal aid before moving to another state with your children, since it can affect which state has custody jurisdiction.",
      "Ask about a guardian ad litem, a person appointed to speak for the child's interests."
    ],
    getSources: (ab) => [["Custody rules for " + getStateName(ab), womensLawHubUrl(ab)]]
  },
  {
    id: "money",
    title: "Money and work",
    getSummary: () => "Financial control is a form of abuse, and there are ways to rebuild independence.",
    getSteps: (ab) => [
      ab === "MO"
        ? "Missouri's Crime Victims' Compensation program can help pay medical bills, counseling, and relocation costs for eligible victims. <a href='https://dps.mo.gov/dir/programs/cvsu/' target='_blank' rel='noopener'>Missouri DPS – Crime Victims' Services</a>."
        : `Every state runs a crime victims' compensation program that can help pay medical bills, counseling, and relocation costs. Ask a local victim advocate, or search "${getStateName(ab)} crime victims compensation."`,
      "Ask about job-protected leave for court dates and safety needs, and whether you qualify for unemployment if you left a job for safety.",
      "Open an account in your name only, using a safe address, and check your credit report for accounts you didn't open.",
      "A court can order support, and decide who is responsible for a shared home or shared debts."
    ],
    getSources: (ab) => ab === "MO" ? [["Missouri DPS – Crime Victims' Services", "https://dps.mo.gov/dir/programs/cvsu/"]] : [["Legal topics for " + getStateName(ab), womensLawHubUrl(ab)]]
  },
  {
    id: "immigration",
    title: "Immigration options",
    getSummary: () => "Your immigration status should not stop you from getting protection.",
    getSteps: () => [
      "A VAWA self-petition lets some spouses, children, and parents of a U.S. citizen or permanent resident apply for status without the abuser's knowledge or help. <a href='https://www.uscis.gov/humanitarian/battered-spouse-children-parents' target='_blank' rel='noopener'>USCIS – VAWA self-petitions</a>.",
      "A U visa can protect victims of certain crimes who help law enforcement; a T visa protects trafficking victims. <a href='https://www.uscis.gov/humanitarian/victims-of-human-trafficking-and-other-crimes' target='_blank' rel='noopener'>USCIS – U and T visas</a>.",
      "Talk to an immigration attorney or DOJ-accredited representative before filing anything. Many nonprofits offer this for free.",
      "Courts and shelters generally help regardless of immigration status. Ask an advocate about your rights first."
    ],
    getSources: () => [
      ["USCIS – VAWA self-petitions", "https://www.uscis.gov/humanitarian/battered-spouse-children-parents"],
      ["USCIS – U and T visas", "https://www.uscis.gov/humanitarian/victims-of-human-trafficking-and-other-crimes"]
    ]
  },
  {
    id: "address",
    title: "Keeping your address private",
    getSummary: (ab) => ab === "MO"
      ? "Missouri's Safe at Home program lets survivors use a substitute address so an abuser can't find them through public records (RSMo 589.660–589.683)."
      : `About 40 states run some kind of Address Confidentiality Program, usually through the Secretary of State's office (sometimes called "Safe at Home" or "ACP"), letting survivors use a substitute address on public records.`,
    getSteps: (ab) => ab === "MO" ? [
        "Run by the Missouri Secretary of State's office, free to join, for adult or child victims of domestic violence, rape, sexual assault, or stalking who fear further harm.",
        "You apply in person with a trained 'application assistant,' usually a domestic violence advocate, not directly online.",
        "Once enrolled, you can use your designated substitute address on voter registration, state agency records, and more, keeping your real address out of public records.",
        "Find an application assistant through a local shelter (see Find help), or learn more at <a href='https://www.sos.mo.gov' target='_blank' rel='noopener'>sos.mo.gov</a> (search 'Safe at Home')."
      ] : [
        `Check whether ${getStateName(ab)} has a program: ask a local shelter advocate, or search "${getStateName(ab)} address confidentiality program."`,
        "Enrollment is usually free and goes through a trained advocate or state office, not a direct online form.",
        "If enrolled, you typically get a substitute address to use on voter registration, school, and other public records so your real address stays private."
      ],
    getSources: (ab) => ab === "MO" ? [["Missouri Secretary of State", "https://www.sos.mo.gov"]] : [["Legal topics for " + getStateName(ab), womensLawHubUrl(ab)]]
  },
  {
    id: "digital",
    title: "Phone and online safety",
    getSummary: () => "Abusers sometimes track phones, accounts, and locations.",
    getSteps: () => [
      "If you think your phone is monitored, use a different device (a library computer or a friend's phone) to plan.",
      "Check location sharing, linked accounts, and unknown apps. Change passwords and turn on two-step login.",
      "Screenshot threatening messages before blocking anyone, and keep copies off the shared device.",
      "Removing tracking software can alert the person, so get advice before changing anything if you feel unsafe.",
      "Detailed technology safety guides: <a href='https://www.techsafety.org' target='_blank' rel='noopener'>techsafety.org</a> (National Network to End Domestic Violence)."
    ],
    getSources: () => [["NNEDV Safety Net Project", "https://www.techsafety.org"]]
  }
];

// Hotlines and organizations shown in the "Find help" tab.
// c = category tags used by the filter chips. p = phone, u = website.
const HELP_RESOURCES = [
  { name: "911", desc: "Immediate danger. Emergency police, fire, and medical help.", tags: ["Emergency"], phone: "911" },
  { name: "National Domestic Violence Hotline", desc: "24/7, free, confidential. Advocates can help you find shelter and legal help near you. Text START to 88788 or chat at thehotline.org.", tags: ["Emergency","Shelter","Legal"], phone: "1-800-799-7233" },
  { name: "True North of Columbia, Inc.", desc: "24/7 hotline and confidential emergency shelter for Boone County and surrounding Missouri counties. Also offers court and hospital advocacy.", tags: ["Emergency","Shelter"], phone: "1-800-548-2480" },
  { name: "DomesticShelters.org", desc: "Searchable, regularly updated directory of real shelters and programs by city and state, nationwide.", tags: ["Shelter"], site: "domesticshelters.org" },
  { name: "211", desc: "Dial or search online to reach local health and human-service referrals, including emergency shelter, in your area.", tags: ["Shelter","Money"], site: "211.org" },
  { name: "988 Suicide & Crisis Lifeline", desc: "Call or text if you are in emotional crisis.", tags: ["Emotional"], phone: "988" },
  { name: "StrongHearts Native Helpline", desc: "Support for Native Americans and Alaska Natives facing abuse.", tags: ["Emergency","Shelter"], phone: "1-844-762-8483" },
  { name: "Love Is Respect", desc: "Support for teens and young adults in unhealthy relationships. Text LOVEIS to 22522.", tags: ["Emergency","Emotional"], phone: "1-866-331-9474" },
  { name: "RAINN", desc: "Support after sexual assault.", tags: ["Emotional","Emergency"], phone: "1-800-656-4673" },
  { name: "WomensLaw.org", desc: "Plain-language legal information for every state, plus forms and an email helpline.", tags: ["Legal"], site: "womenslaw.org" },
  { name: "LawHelp.org", desc: "Find free legal aid in your state.", tags: ["Legal"], site: "lawhelp.org" },
  { name: "Missouri Coalition Against Domestic and Sexual Violence", desc: "Connects to local programs and shelters across Missouri.", tags: ["Shelter","Legal"], site: "mocadsv.org" },
  { name: "Immigration Advocates Network legal directory", desc: "Find nonprofit immigration legal help.", tags: ["Immigration","Legal"], site: "immigrationlawhelp.org" },
  { name: "Crime victim compensation boards", desc: "Find your state's program for help paying medical and relocation costs.", tags: ["Money"], site: "nacvcb.org" }
];
const HELP_CATEGORIES = ["All","Emergency","Shelter","Legal","Immigration","Money","Emotional"];

// The Safety Plan checklist, grouped into four phases.
const SAFETY_SECTIONS = [
  { heading: "Get ready, before you need it", note: "Things that are easier to do when things are calm.", items: [
      "Keep copies of ID, birth certificate, Social Security card, lease or mortgage papers, and bank info somewhere outside the home: a trusted friend, relative, or safe deposit box.",
      "Write down important phone numbers somewhere the other person won't find, in case your phone isn't safe to use.",
      "Set aside a small amount of cash if you can.",
      "Save evidence (photos, messages, dates of incidents) somewhere the other person cannot access.",
      "Identify a trusted neighbor, friend, or family member you can call or go to."
  ]},
  { heading: "If you need to leave quickly", note: "A plan for the moment you need to go.", items: [
      "Pack a small bag: medicine, keys, chargers, and a change of clothes for you and your children.",
      "Plan two ways out of each room and the building where you spend time.",
      "Agree on a code word with someone you trust that means \"call for help\" or \"come get me.\"",
      "Know where you'll go: a shelter, a friend's house, or a public place.",
      "If you have pets, know which shelters or friends can take them in. Some shelters, including local ones, accept pets."
  ]},
  { heading: "Staying safer after you leave", note: "Steps for the days and weeks after.", items: [
      "Change locks, passwords, and PINs if the other person had access to them.",
      "Consider a protective order. See the Learn tab for your state's process.",
      "Tell trusted people at work, school, or your children's school what's happening.",
      "Look into keeping your new address private. See Learn &rarr; Keeping your address private.",
      "Check your phone, car, and belongings for trackers if you're worried about monitoring."
  ]},
  { heading: "Keep close by", note: "Numbers worth memorizing or writing down somewhere safe.", items: [
      "911 for immediate danger.",
      "1-800-799-7233: National Domestic Violence Hotline, 24/7.",
      "Your local shelter's hotline. See the Find help tab.",
      "One trusted person's number memorized, in case your phone isn't available."
  ]}
];

// "My roadmap" questions. Each one maps to the Learn topic IDs it
// points to, so checking a box can recommend the right topics.
const ROADMAP_QUESTIONS = [
  { text: "I need to be safe from someone right now or soon", relatedTopics: ["orders","digital"] },
  { text: "We share a home or a lease", relatedTopics: ["housing","orders"] },
  { text: "We have children together", relatedTopics: ["kids","orders"] },
  { text: "They control money, or I am worried about work", relatedTopics: ["money"] },
  { text: "My immigration status is tied to them, or I am not a citizen", relatedTopics: ["immigration"] },
  { text: "I am worried they will find where I live", relatedTopics: ["address","digital"] },
  { text: "They track my phone or accounts", relatedTopics: ["digital"] }
];

/* ---------------------------------------------------------------------
   SECTION 2: APP STATE
   These are the only variables that change while the app runs. Every
   one of them is "what tab/topic/choice is currently showing."
   --------------------------------------------------------------------- */
let currentTab = "home";               // which bottom-nav tab is open
let currentTopicId = LEGAL_TOPICS[0].id; // which Learn topic is open
let currentStateAbbr = "MO";           // which state is selected in Learn
let helpSearchText = "";               // text typed in "Find help" search
let helpCategoryFilter = "All";        // which filter chip is selected
let locationSearchText = "";           // text typed in the location box
let roadmapChecked = new Set();        // indices of checked roadmap boxes
let safetyChecked = new Set();         // indices of checked safety items
let tabHistory = [];                   // lets the Back button retrace steps

/* ---------------------------------------------------------------------
   SECTION 3: NAVIGATION
   Every navigation action follows the same pattern: update a state
   variable above, then call renderApp() to redraw the screen.
   --------------------------------------------------------------------- */
function goToTab(tabName, topicId) {
  if (tabName !== currentTab) tabHistory.push({ tab: currentTab, topic: currentTopicId });
  currentTab = tabName;
  if (tabName === "learn" && topicId) currentTopicId = topicId;
  renderApp();
  scrollTo(0, 0);
}
function goBack() {
  if (!tabHistory.length) return;
  const previous = tabHistory.pop();
  currentTab = previous.tab;
  currentTopicId = previous.topic;
  renderApp();
  scrollTo(0, 0);
}
function selectTopic(topicId) { currentTopicId = topicId; renderApp(); scrollTo(0, 0); }
function selectState(abbr) { currentStateAbbr = abbr; renderApp(); }
function toggleRoadmapAnswer(i) { roadmapChecked.has(i) ? roadmapChecked.delete(i) : roadmapChecked.add(i); renderApp(); }
function toggleSafetyItem(i) { safetyChecked.has(i) ? safetyChecked.delete(i) : safetyChecked.add(i); renderApp(); }

/* ---------------------------------------------------------------------
   SECTION 4: SMALL HELPERS
   --------------------------------------------------------------------- */
const $ = (selector) => document.querySelector(selector);

// A topic's getSummary/getSteps/getSources are always functions (see
// SECTION 1), so calling them with the current state is all we need.
function topicSummary(topic) { return topic.getSummary(currentStateAbbr); }
function topicSteps(topic) { return topic.getSteps(currentStateAbbr); }
function topicSources(topic) { return topic.getSources(currentStateAbbr); }

function contactLink(resource) {
  if (resource.phone) {
    const digitsOnly = resource.phone.replace(/[^0-9]/g, "");
    return `<a href="tel:${digitsOnly}"><b>${resource.phone}</b></a>`;
  }
  return `<a href="https://${resource.site}" target="_blank" rel="noopener">${resource.site}</a>`;
}

function searchByLocationText() {
  const typed = $("#locationInput").value.trim();
  const messageBox = $("#locationMessage");
  if (!typed) { messageBox.textContent = "Type a city, state, region, or address first."; return; }
  locationSearchText = typed;
  const mapUrl = `https://www.google.com/maps/search/domestic+violence+shelter+near+${encodeURIComponent(typed)}`;
  window.open(mapUrl, "_blank", "noopener");
  messageBox.textContent = `Opened a map search near "${typed}" in a new tab.`;
}

function searchNearMyLocation() {
  const messageBox = $("#locationMessage");
  if (!navigator.geolocation) { messageBox.textContent = "This browser doesn't support location search. Type a city or address above instead."; return; }
  if (location.protocol !== "https:" && location.hostname !== "localhost") { messageBox.textContent = "Location only works on a secure (https) page. Type a city or address above instead."; return; }
  messageBox.textContent = "Finding your location. Your browser may ask for permission...";
  navigator.geolocation.getCurrentPosition(
    (position) => {
      const { latitude, longitude } = position.coords;
      const mapUrl = `https://www.google.com/maps/search/domestic+violence+shelter/@${latitude},${longitude},12z`;
      window.open(mapUrl, "_blank", "noopener");
      messageBox.textContent = "Opened a map search near you in a new tab.";
    },
    (error) => {
      const errorMessages = {
        1: "Location permission was denied. Check your browser's site settings to allow it, or just type a city or address above.",
        2: "Your location isn't available right now. Type a city or address above instead.",
        3: "Finding your location took too long. Type a city or address above instead."
      };
      messageBox.textContent = errorMessages[error.code] || "Couldn't get your location. Type a city or address above instead.";
    },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
  );
}

function quickExit() { location.replace("https://weather.com"); }

/* ---------------------------------------------------------------------
   SECTION 5: ONE RENDER FUNCTION PER TAB
   Each function returns an HTML string for the <main> area. They read
   from the state variables in SECTION 2 and the content in SECTION 1.
   --------------------------------------------------------------------- */

function renderHomeTab() {
  return `
    <div class="hero">
      <h1>You have options.</h1>
      <p>Learn how the law can protect you, build a personal list of next steps, and find people who can help. Nothing you do here is saved or sent anywhere.</p>
      <p>In danger now? Call <a href="tel:911">911</a>. For support any time: <a href="tel:18007997233">1-800-799-7233</a>.</p>
    </div>
    <div class="card">
      <h3>Start here</h3>
      <p class="mute">Answer a few questions to see which legal topics apply to you.</p>
      <button class="btn" onclick="goToTab('roadmap')">Build my roadmap</button>
      <button class="btn alt" onclick="goToTab('learn')">Browse topics</button>
    </div>
    <div class="card">
      <h3>Good to know</h3>
      <p>This app shares general legal information, not legal advice. Laws differ by state and change. A legal aid organization can tell you what applies to your case, often for free.</p>
      <p class="note">To leave this page quickly, press the red Quick exit button or press Escape twice.</p>
    </div>`;
}

function renderLearnTab() {
  const topic = LEGAL_TOPICS.find(t => t.id === currentTopicId) || LEGAL_TOPICS[0];
  const sources = topicSources(topic);

  const stateDropdown = `
    <label class="mute" for="stateSelect">State</label><br>
    <select id="stateSelect" onchange="selectState(this.value)" style="width:100%;padding:.6rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:1rem;margin:.3rem 0 .5rem">
      ${STATE_LIST.map(([abbr, name]) => `<option value="${abbr}" ${abbr === currentStateAbbr ? "selected" : ""}>${name}</option>`).join("")}
    </select>`;

  const topicButtons = `
    <div class="topicnav">
      ${LEGAL_TOPICS.map(t => `<button aria-current="${t.id === topic.id}" onclick="selectTopic('${t.id}')">${t.title}</button>`).join("")}
    </div>`;

  const orderTypesBlock = topic.orderTypes ? `
    <p class="mute"><b>Common types. Check which fits your situation:</b></p>
    <div class="typegrid">
      ${topic.orderTypes.map(ot => `<div class="typecard"><b>${ot.title}</b><p>${ot.desc}</p></div>`).join("")}
    </div>
    <p class="mute" style="margin-top:.8rem"><b>Filing steps once you know which type:</b></p>` : "";

  const stepsList = `<ol class="stepper">${topicSteps(topic).map(step => `<li>${step}</li>`).join("")}</ol>`;

  const sourceLine = sources.length
    ? `<p class="srcline">Source: ${sources.map(([label, url]) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`).join(" &middot; ")}</p>`
    : "";

  return `
    <h2>Learn</h2>
    <p class="mute">Choose your state, pick a topic, then follow the steps in order.</p>
    ${stateDropdown}
    ${topicButtons}
    <div class="card">
      <h3>${topic.title} in ${getStateName(currentStateAbbr)}</h3>
      <p>${topicSummary(topic)}</p>
      ${orderTypesBlock}
      ${stepsList}
      ${sourceLine}
    </div>`;
}

function renderRoadmapTab() {
  const matchedTopicIds = [...new Set(
    ROADMAP_QUESTIONS.flatMap((q, i) => roadmapChecked.has(i) ? q.relatedTopics : [])
  )];

  const questionList = `
    <div class="card">
      ${ROADMAP_QUESTIONS.map((q, i) => `
        <label class="row">
          <input type="checkbox" ${roadmapChecked.has(i) ? "checked" : ""} onchange="toggleRoadmapAnswer(${i})">
          <span>${q.text}</span>
        </label>`).join("")}
    </div>`;

  let resultsBlock;
  if (matchedTopicIds.length) {
    const topicCards = matchedTopicIds.map(id => {
      const topic = LEGAL_TOPICS.find(t => t.id === id);
      return `
        <div class="card">
          <b>${topic.title}</b>
          <p class="mute">${topicSummary(topic)}</p>
          <button class="btn alt" onclick="goToTab('learn', '${id}')">Read this topic</button>
        </div>`;
    }).join("");
    resultsBlock = `
      <h3>Topics to read first</h3>
      ${topicCards}
      <div class="card">
        <b>Next step for everyone</b>
        <p>Talk to an advocate or legal aid organization about your state. See <a href="#" onclick="goToTab('help');return false">Find help</a>.</p>
      </div>`;
  } else {
    resultsBlock = `<p class="mute">Your topics will appear here.</p>`;
  }

  return `
    <h2>My roadmap</h2>
    <p class="mute">Check anything that applies. You can skip any question.</p>
    ${questionList}
    ${resultsBlock}`;
}

function renderFindHelpTab() {
  const matches = HELP_RESOURCES.filter(r =>
    (helpCategoryFilter === "All" || r.tags.includes(helpCategoryFilter)) &&
    (r.name + r.desc).toLowerCase().includes(helpSearchText.toLowerCase())
  );
  const resultCards = matches.length
    ? matches.map(r => `
        <div class="card">
          <b>${r.name}</b>
          <div class="tag">${r.tags.join(", ")}</div>
          <p>${r.desc}</p>
          ${contactLink(r)}
        </div>`).join("")
    : "<p class='mute'>No matches. Try a different word or category.</p>";

  return `
    <h2>Find help</h2>
    <div class="card">
      <b>Find shelters by location</b>
      <p class="mute">Type a city, state, region, or exact address, or use your device's location. Nothing is saved.</p>
      <input type="search" id="locationInput" placeholder="e.g. Columbia, MO or a street address" value="${locationSearchText}" aria-label="Location search">
      <div style="display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap">
        <button class="btn" onclick="searchByLocationText()">Search this location</button>
        <button class="btn alt" onclick="searchNearMyLocation()">Use my location</button>
      </div>
      <p id="locationMessage" class="mute"></p>
    </div>
    <input type="search" id="helpSearchInput" placeholder="Search organizations" value="${helpSearchText}" aria-label="Search organizations">
    <div class="chips">
      ${HELP_CATEGORIES.map(c => `<button class="chip" aria-pressed="${c === helpCategoryFilter}" onclick="helpCategoryFilter='${c}';renderApp()">${c}</button>`).join("")}
    </div>
    <p class="note">Need shelter right now? Call the National Hotline. Advocates can find open beds near you.</p>
    ${resultCards}
    <p class="mute">Confirm details before relying on them. Contact information can change.</p>`;
}

function renderSafetyTab() {
  let runningIndex = -1;
  const totalItems = SAFETY_SECTIONS.reduce((sum, s) => sum + s.items.length, 0);
  const checkedCount = safetyChecked.size;
  const percentDone = Math.round(100 * checkedCount / totalItems);

  const sectionCards = SAFETY_SECTIONS.map(section => `
    <div class="card">
      <h3>${section.heading}</h3>
      <p class="mute">${section.note}</p>
      ${section.items.map(item => {
        runningIndex++;
        const thisIndex = runningIndex;
        return `
          <label class="row">
            <input type="checkbox" ${safetyChecked.has(thisIndex) ? "checked" : ""} onchange="toggleSafetyItem(${thisIndex})">
            <span>${item}</span>
          </label>`;
      }).join("")}
    </div>`).join("");

  return `
    <h2>Safety plan</h2>
    <p class="mute">A checklist to think through, grouped by when you'd use it. Checks stay on this screen only and clear when you close the page.</p>
    <div class="card">
      <b>${checkedCount} of ${totalItems} steps checked</b>
      <div style="background:var(--line);border-radius:999px;height:8px;margin-top:.5rem;overflow:hidden">
        <div style="background:var(--teal);height:100%;width:${percentDone}%"></div>
      </div>
    </div>
    ${sectionCards}
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <button class="btn alt" onclick="safetyChecked.clear();renderApp()">Clear checklist</button>
      <button class="btn" onclick="window.print()">Print or save this page</button>
    </div>
    <p class="mute" style="margin-top:.5rem">Printing makes a paper or PDF copy on your own device. Nothing is uploaded or sent anywhere.</p>`;
}

// Maps each tab's id to the function that renders it.
const TAB_RENDERERS = {
  home: renderHomeTab,
  learn: renderLearnTab,
  roadmap: renderRoadmapTab,
  help: renderFindHelpTab,
  safety: renderSafetyTab
};

/* ---------------------------------------------------------------------
   SECTION 6: THE MAIN RENDER LOOP
   renderApp() is called after every single user action in this app.
   It redraws the bottom tab bar, redraws the main content for the
   current tab, then re-attaches event listeners to any inputs (since
   rebuilding the HTML wipes out old listeners).
   --------------------------------------------------------------------- */
function renderTabBar() {
  $("#tabBar").innerHTML = TAB_LIST.map(([id, label]) =>
    `<button role="tab" aria-selected="${id === currentTab}" onclick="goToTab('${id}')">${label}</button>`
  ).join("");
}

function renderApp() {
  renderTabBar();
  $("#appRoot").innerHTML = TAB_RENDERERS[currentTab]();

  // Re-wire the "Find help" search box so typing updates results
  // live without losing cursor position on every keystroke.
  const searchBox = $("#helpSearchInput");
  if (searchBox) {
    searchBox.oninput = (e) => {
      helpSearchText = e.target.value;
      const cursorPos = e.target.selectionStart;
      renderApp();
      const refreshedBox = $("#helpSearchInput");
      refreshedBox.focus();
      refreshedBox.setSelectionRange(cursorPos, cursorPos);
    };
  }
  // Re-wire the location search box (typing + pressing Enter).
  const locationBox = $("#locationInput");
  if (locationBox) {
    locationBox.oninput = (e) => { locationSearchText = e.target.value; };
    locationBox.onkeydown = (e) => { if (e.key === "Enter") searchByLocationText(); };
  }
  // Show/hide the Back button depending on whether there's history.
  const backButton = $("#backBtn");
  backButton.hidden = !tabHistory.length;
  backButton.onclick = goBack;
}

/* ---------------------------------------------------------------------
   SECTION 7: ONE-TIME SETUP
   Runs once when the page loads: wires the Quick-exit button and the
   double-Escape shortcut, then draws the app for the first time.
   --------------------------------------------------------------------- */
$("#exitBtn").onclick = quickExit;
let lastEscapeTime = 0;
addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    const now = Date.now();
    if (now - lastEscapeTime < 800) quickExit();
    lastEscapeTime = now;
  }
});

renderApp(); // draw the Home tab on first load
</script>
</body></html>
